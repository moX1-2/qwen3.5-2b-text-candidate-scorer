<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title description">
  <title id="title">JEV Candidate Scorer 模型架构</title>
  <desc id="description">问题和完整候选列表被构造成每个候选的独立判断提示。各分支经 Qwen3.5-2B 文本骨干与 LoRA、末位隐藏状态及共享线性评分头得到分数，组内 Softmax 后用于单选或前 N 项排序。训练使用单正确项交叉熵。</desc>
  <defs>
    <style>
      text { font-family: "SimHei", "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #17243a; }
      .title { font-size: 35px; font-weight: 750; }
      .subtitle { font-size: 18px; fill: #52647c; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #52647c; }
      .mono { font-family: "SimHei", "Cascadia Code", "Consolas", monospace; font-size: 14px; }
      .panel { fill: #fff; stroke: #d5e0ef; stroke-width: 2; }
      .blue { fill: #eaf4ff; stroke: #8abaf1; stroke-width: 1.5; }
      .violet { fill: #f1efff; stroke: #aaa0e8; stroke-width: 1.5; }
      .orange { fill: #fff2e2; stroke: #edbe83; stroke-width: 1.5; }
      .green { fill: #e9f7f1; stroke: #91ccb0; stroke-width: 1.5; }
      .line { stroke: #637997; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8ba1bc; stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#637997"/>
    </marker>
  </defs>

  <rect width="1600" height="920" fill="#f8fbff"/>
  <text x="52" y="58" class="title">JEV Candidate Scorer</text>
  <text x="52" y="88" class="subtitle">基于 Qwen3.5-2B 文本骨干的可变候选评分模型</text>
  <text x="1547" y="57" text-anchor="end" class="body" font-weight="700">8 万题 · 第 5,000 步</text>
  <text x="1547" y="83" text-anchor="end" class="small">单正确项训练 · 候选排序推理</text>

  <rect x="44" y="113" width="1512" height="152" rx="13" class="panel"/>
  <text x="68" y="146" class="panel-title">（a）输入序列化</text>
  <text x="70" y="177" class="body" font-weight="700">问题描述 P</text>
  <text x="70" y="205" class="small">中文或英文；与候选列表共同输入</text>
  <text x="70" y="234" class="small">每题 2～5 个候选项</text>
  <rect x="397" y="157" width="660" height="82" rx="8" class="blue"/>
  <text x="419" y="187" class="mono">问题：P</text>
  <text x="419" y="212" class="mono">完整候选列表：A. c1  B. c2  ...  K. cK</text>
  <rect x="1090" y="157" width="424" height="82" rx="8" class="violet"/>
  <text x="1112" y="187" class="mono">待判断候选：i. ci</text>
  <text x="1112" y="213" class="mono">判断：</text>
  <path d="M1057 198 H1087" class="line"/>

  <rect x="44" y="283" width="1512" height="347" rx="13" class="panel"/>
  <text x="68" y="317" class="panel-title">（b）推理：每个候选独立前向，参数共享</text>
  <rect x="68" y="367" width="203" height="188" rx="10" class="blue"/>
  <text x="169" y="401" text-anchor="middle" class="box-title">一道问题</text>
  <text x="169" y="433" text-anchor="middle" class="body">描述 P</text>
  <text x="169" y="464" text-anchor="middle" class="body">完整候选列表</text>
  <text x="169" y="495" text-anchor="middle" class="body">A、B、…、K</text>
  <text x="169" y="531" text-anchor="middle" class="small">候选数可变</text>

  <rect x="322" y="357" width="222" height="205" rx="10" class="violet"/>
  <text x="433" y="388" text-anchor="middle" class="box-title">K 个判断提示</text>
  <rect x="343" y="409" width="180" height="37" rx="6" fill="#fff" stroke="#c9c2f2"/>
  <rect x="343" y="455" width="180" height="37" rx="6" fill="#fff" stroke="#c9c2f2"/>
  <rect x="343" y="501" width="180" height="37" rx="6" fill="#fff" stroke="#c9c2f2"/>
  <text x="433" y="434" text-anchor="middle" class="body">完整上下文 + A</text>
  <text x="433" y="480" text-anchor="middle" class="body">完整上下文 + B</text>
  <text x="433" y="526" text-anchor="middle" class="body">完整上下文 + K</text>
  <path d="M272 461 H318" class="line"/>

  <rect x="596" y="367" width="258" height="188" rx="10" class="blue"/>
  <text x="725" y="404" text-anchor="middle" class="box-title">Qwen3.5-2B</text>
  <text x="725" y="433" text-anchor="middle" class="body">文本骨干 · 24 层</text>
  <text x="725" y="461" text-anchor="middle" class="body">DeltaNet + 全注意力</text>
  <rect x="632" y="485" width="186" height="45" rx="7" fill="#fff" stroke="#8abaf1"/>
  <text x="725" y="513" text-anchor="middle" class="body">LoRA r=8, α=16</text>
  <path d="M545 461 H592" class="line"/>

  <rect x="905" y="400" width="161" height="120" rx="10" class="violet"/>
  <text x="985" y="434" text-anchor="middle" class="box-title">末位隐藏状态</text>
  <text x="985" y="467" text-anchor="middle" class="mono">hi in R^2048</text>
  <text x="985" y="494" text-anchor="middle" class="small">每个分支一个</text>
  <path d="M855 461 H901" class="line"/>

  <rect x="1117" y="400" width="164" height="120" rx="10" class="orange"/>
  <text x="1199" y="434" text-anchor="middle" class="box-title">共享评分头</text>
  <text x="1199" y="466" text-anchor="middle" class="mono">si = w^T hi + b</text>
  <text x="1199" y="494" text-anchor="middle" class="small">2048 → 1</text>
  <path d="M1067 461 H1113" class="line"/>

  <rect x="1331" y="386" width="198" height="147" rx="10" class="green"/>
  <text x="1430" y="423" text-anchor="middle" class="box-title">组内归一化</text>
  <text x="1430" y="456" text-anchor="middle" class="mono">p = softmax(s)</text>
  <text x="1430" y="487" text-anchor="middle" class="body">选择 Top n</text>
  <text x="1430" y="514" text-anchor="middle" class="small">仅为推理后处理</text>
  <path d="M1282 461 H1327" class="line"/>
  <text x="72" y="601" class="small">所有候选分支使用相同的骨干、LoRA 与评分头；当前实现逐支计算，不复用公共前缀缓存。</text>

  <rect x="44" y="648" width="733" height="206" rx="13" class="panel"/>
  <text x="68" y="682" class="panel-title">（c）共享模型结构</text>
  <rect x="68" y="706" width="185" height="84" rx="8" class="blue"/>
  <text x="160" y="738" text-anchor="middle" class="box-title">文本骨干</text>
  <text x="160" y="766" text-anchor="middle" class="small">隐藏维度 2048</text>
  <rect x="297" y="706" width="185" height="84" rx="8" class="violet"/>
  <text x="389" y="738" text-anchor="middle" class="box-title">LoRA</text>
  <text x="389" y="766" text-anchor="middle" class="small">α=16 · dropout=0.05</text>
  <rect x="526" y="706" width="222" height="84" rx="8" class="orange"/>
  <text x="637" y="738" text-anchor="middle" class="box-title">线性评分头</text>
  <text x="637" y="766" text-anchor="middle" class="small">含偏置的标量投影</text>
  <path d="M255 748 H293" class="line"/>
  <path d="M484 748 H522" class="line"/>
  <text x="69" y="827" class="small">文本权重从 Qwen/Qwen3.5-2B 提取；视觉与 MTP 权重未进入此模型。</text>

  <rect x="795" y="648" width="761" height="206" rx="13" class="panel"/>
  <text x="819" y="682" class="panel-title">（d）训练目标与试玩输出</text>
  <rect x="820" y="706" width="322" height="100" rx="8" class="orange"/>
  <text x="981" y="737" text-anchor="middle" class="box-title">训练：单正确项</text>
  <text x="981" y="767" text-anchor="middle" class="body">Softmax + 交叉熵</text>
  <text x="981" y="792" text-anchor="middle" class="small">8 万题阶段：第 5,000 步</text>
  <rect x="1193" y="706" width="336" height="100" rx="8" class="green"/>
  <text x="1361" y="737" text-anchor="middle" class="box-title">试玩：候选排序</text>
  <text x="1361" y="767" text-anchor="middle" class="body">显示各项相对概率与耗时</text>
  <text x="1361" y="792" text-anchor="middle" class="small">取概率最高的前 n 项</text>
  <path d="M1144 756 H1189" class="line"/>
  <text x="820" y="827" class="small">Top n 不代表经过多正确项训练；概率只在当前候选集合内归一化。</text>

  <text x="50" y="897" class="small">图：JEV Candidate Scorer 的实际训练与推理结构。结构以项目代码和第 5,000 步 checkpoint 为准。</text>
</svg>
